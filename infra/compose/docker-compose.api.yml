services:
  mysql:
    image: mysql:8.4
    container_name: miniapp-api-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: miniapp_api
      MYSQL_USER: miniapp
      MYSQL_PASSWORD: miniapp
    ports:
      - "3307:3306"
    volumes:
      - miniapp_api_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  miniapp_api_mysql_data:
