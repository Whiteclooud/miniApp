services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-miniapp_api}
      MYSQL_USER: ${MYSQL_USER:-miniapp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - miniapp_api_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    restart: unless-stopped
    env_file:
      - ${API_ENV_FILE:-../../apps/api/.env.production}
    environment:
      NODE_ENV: production
      PORT: 3100
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - miniapp_api_uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3100/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  miniapp_api_mysql_data:
  miniapp_api_uploads:
